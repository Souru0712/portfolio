<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>

  </div>
  <div class="swatch" style="background:#00cc6e;color:#0a0a0a;border-color:#00cc6e;aspect-ratio:auto;height:140px"><div><div>accent-dim</div><div class="meta" style="color:#0a0a0a;opacity:0.6;">#00cc6e</div></div></div>
