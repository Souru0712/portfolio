<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="kicker">// elevation · borders, not shadows</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
  <div style="background:#0a0a0a;border:1px solid #262626;border-radius:4px;padding:16px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <div style="color:#e8e8e8">level 0</div>
    <div style="color:#6e6e6e;font-size:10px">page · bg-0</div>
  </div>
  <div style="background:#111111;border:1px solid #262626;border-radius:4px;padding:16px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <div style="color:#e8e8e8">level 1</div>
    <div style="color:#6e6e6e;font-size:10px">card · bg-1</div>
  </div>
  <div style="background:#161616;border:1px solid #333;border-radius:4px;padding:16px;height:96px;display:flex;flex-direction:column;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <div style="color:#e8e8e8">level 2</div>
    <div style="color:#6e6e6e;font-size:10px">hover · bg-2</div>
  </div>
</div>
<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#6e6e6e;margin-top:14px">// shadows reserved for focus glow only</div>
</body></html>
