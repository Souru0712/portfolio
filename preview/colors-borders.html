<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="kicker">// borders</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
  <div style="background:#111;border:1px solid #262626;border-radius:4px;height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <div style="color:#e8e8e8">border-1</div>
    <div style="color:#6e6e6e;font-size:10px">#262626</div>
  </div>
  <div style="background:#111;border:1px solid #333;border-radius:4px;height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <div style="color:#e8e8e8">border-2</div>
    <div style="color:#6e6e6e;font-size:10px">#333333 · hover</div>
  </div>
  <div style="background:#111;border:1px solid #00ff88;border-radius:4px;height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;">
    <div style="color:#00ff88">border-accent</div>
    <div style="color:#6e6e6e;font-size:10px">focus / active</div>
  </div>
</div>
</body></html>
