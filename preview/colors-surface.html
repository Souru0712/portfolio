<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="kicker">// surface tones · dark + light</div>

<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#6e6e6e;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">dark · default</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px">
  <div class="swatch" style="background:#0a0a0a"><div><div>bg-0</div><div class="meta">#0a0a0a</div></div></div>
  <div class="swatch" style="background:#111111"><div><div>bg-1</div><div class="meta">#111111</div></div></div>
  <div class="swatch" style="background:#161616"><div><div>bg-2</div><div class="meta">#161616</div></div></div>
  <div class="swatch" style="background:#1f1f1f"><div><div>bg-3</div><div class="meta">#1f1f1f</div></div></div>
</div>

<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#6e6e6e;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px">light · alt</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
  <div class="swatch" style="background:#ffffff;color:#0a0a0a;border-color:#e5e5e5"><div><div>bg-0</div><div class="meta" style="color:#666">#ffffff</div></div></div>
  <div class="swatch" style="background:#fafafa;color:#0a0a0a;border-color:#e5e5e5"><div><div>bg-1</div><div class="meta" style="color:#666">#fafafa</div></div></div>
  <div class="swatch" style="background:#f3f3f1;color:#0a0a0a;border-color:#e5e5e5"><div><div>bg-2</div><div class="meta" style="color:#666">#f3f3f1</div></div></div>
  <div class="swatch" style="background:#ebebe8;color:#0a0a0a;border-color:#dadada"><div><div>bg-3</div><div class="meta" style="color:#666">#ebebe8</div></div></div>
</div>
</body></html>
